services:
  - type: web
    name: course-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BOT_TOKEN
        sync: false          # Render спросит значения при создании
      - key: CHANNEL_ID
        sync: false
      - key: CHANNEL_URL
        sync: false
      - key: STORAGE_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SHEET_URL
        sync: false
      - key: SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: COMMUNITY_CHAT_ID
        sync: false
      - key: STRIPE_AUTOMATIC_TAX
        value: "0"
