services:
  - type: worker
    name: course-bot
    runtime: python
    plan: starter            # $7/мес — у воркеров нет бесплатного тарифа
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DB_PATH
        value: /data/users.db
      - key: BOT_TOKEN
        sync: false          # Render спросит значение при создании
      - key: CHANNEL_ID
        sync: false
      - key: CHANNEL_URL
        sync: false
      - key: STORAGE_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1              # $0.25/мес — тут живёт база, кто на каком уроке
